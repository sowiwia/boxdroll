<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- GitHub Pages can't send headers, so the policy lives here. Confetti renders in a blob: worker. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' https://*.ltrbxd.com; connect-src https://boxdroll.boxdroll.workers.dev http://localhost:8787; worker-src blob:; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>boxdroll</title>
    <meta name="description" content="Paste a Letterboxd list and get a random movie to watch." />
    <meta property="og:title" content="boxdroll" />
    <meta
      property="og:description"
      content="Paste a Letterboxd list and get a random movie to watch."
    />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="fonts/Monocraft.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div class="letterbox" aria-hidden="true"></div>

    <main class="app">
      <header class="header">
        <h1 class="logo">boxdroll</h1>
        <p class="tagline"><span data-i18n="tagline">tonight nobody has to choose</span></p>
      </header>

      <form class="roll-form" id="roll-form">
        <label class="visually-hidden" for="list-url" data-i18n="inputLabel"
          >Letterboxd list URL</label
        >
        <input
          id="list-url"
          name="url"
          type="text"
          inputmode="url"
          autocomplete="off"
          spellcheck="false"
          placeholder="letterboxd.com/user/list/..."
        />
        <button class="button" type="submit" data-i18n="roll">roll</button>
      </form>

      <p class="status" id="status" role="status" aria-live="polite"></p>

      <section class="machine" id="machine" hidden>
        <ol class="reel" id="reel" aria-hidden="true"></ol>
        <div class="payline" aria-hidden="true"></div>
      </section>

      <section class="result" id="result" aria-live="polite" hidden>
        <a
          class="poster"
          id="poster"
          target="_blank"
          rel="noopener"
          tabindex="-1"
          aria-hidden="true"
          hidden
        >
          <canvas class="poster-canvas" id="poster-canvas"></canvas>
        </a>
        <div class="result-info">
          <p class="result-title" id="result-title"></p>
          <p class="result-meta">
            <span id="result-year"></span>
            <span data-i18n="from">from</span>
            <span id="result-list"></span>
          </p>
          <div class="result-actions">
            <a
              class="link"
              id="result-link"
              target="_blank"
              rel="noopener"
              data-i18n="viewOnLetterboxd"
            >
              view on letterboxd
            </a>
            <button class="button button-small" id="reroll" type="button" data-i18n="reroll">
              reroll
            </button>
          </div>
        </div>
      </section>
    </main>

    <footer class="corner">
      <button class="link sound-toggle" id="sound-toggle" type="button" aria-pressed="true">
        <svg
          width="16"
          height="14"
          viewBox="0 0 8 7"
          aria-hidden="true"
          shape-rendering="crispEdges"
        >
          <path d="M0 2h2V1h1V0h1v7H3V6H2V5H0z" />
          <path class="sound-waves" d="M5 2h1v3H5zM7 1h1v5H7z" />
          <path class="sound-muted" d="M5 2h1v1H5zM7 2h1v1H7zM6 3h1v1H6zM5 4h1v1H5zM7 4h1v1H7z" />
        </svg>
      </button>
      <button class="link lang-toggle" id="lang-toggle" type="button">
        <span data-lang="en">en</span> / <span data-lang="es">es</span>
      </button>
      <div class="support">
        <svg
          class="heart"
          width="14"
          height="12"
          viewBox="0 0 7 6"
          aria-hidden="true"
          shape-rendering="crispEdges"
        >
          <path d="M1 0h2v1h1V0h2v1h1v2H6v1H5v1H4v1H3V5H2V4H1V3H0V1h1z" />
        </svg>
        <a
          class="link support-link"
          href="https://cafecito.app/sowiwia"
          target="_blank"
          rel="noopener"
          >cafecito</a
        >
        <span aria-hidden="true">/</span>
        <a class="link support-link" href="https://ko-fi.com/sowiwia" target="_blank" rel="noopener"
          >ko-fi</a
        >
      </div>
    </footer>

    <svg class="visually-hidden" aria-hidden="true">
      <filter id="posterize" color-interpolation-filters="sRGB">
        <feComponentTransfer>
          <feFuncR type="discrete" tableValues="0 0.14 0.29 0.43 0.57 0.71 0.86 1" />
          <feFuncG type="discrete" tableValues="0 0.14 0.29 0.43 0.57 0.71 0.86 1" />
          <feFuncB type="discrete" tableValues="0 0.14 0.29 0.43 0.57 0.71 0.86 1" />
        </feComponentTransfer>
      </filter>
    </svg>
  </body>
</html>
